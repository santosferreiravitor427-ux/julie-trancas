<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Julie’s Tranças</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Poppins;
  background:linear-gradient(135deg,#f8e8ff,#fff5e6);
  overflow-x:hidden;
}

canvas{position:fixed;top:0;left:0;z-index:-1}

header{
  padding:20px 40px;
}

.logo{
  font-size:32px;
  font-family:'Playfair Display';
  color:#6a0dad;
}

/* HERO */
.hero{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  padding:120px 20px;
}

.hero h1{
  font-size:80px;
  color:#6a0dad;
  font-family:'Playfair Display';
  letter-spacing:12px;
  margin-bottom:10px;
}

.frase{
  font-size:22px;
  color:#555;
  margin-bottom:10px;
}

.typing{
  font-size:20px;
  color:#d18b00;
  margin-bottom:20px;
}

.btn{
  display:inline-block;
  margin-top:20px;
  padding:18px 40px;
  background:linear-gradient(45deg,#6a0dad,#a855f7);
  color:white;
  border-radius:50px;
  text-decoration:none;
  font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  transition:.3s;
}

.btn:hover{
  transform:scale(1.05);
}

.hero img{
  width:280px;
  margin-top:40px;
  border-radius:30px;
  box-shadow:0 20px 40px rgba(0,0,0,.2);
}

/* AVATAR */
.avatar{
  position:fixed;
  right:20px;
  bottom:20px;
  width:90px;
}

.wave{
  animation:wave 1.5s infinite;
}

@keyframes wave{
  0%{transform:rotate(0)}
  25%{transform:rotate(15deg)}
  50%{transform:rotate(0)}
  75%{transform:rotate(-15deg)}
  100%{transform:rotate(0)}
}

/* TITULO GALERIA */
.titulo-fotos{
  text-align:center;
  margin-top:60px;
}

.titulo-fotos h2{
  font-size:36px;
  color:#6a0dad;
  font-family:'Playfair Display';
}

.titulo-fotos p{
  color:#777;
}

/* GALERIA */
.gallery{
  padding:40px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.grid img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:20px;
  transition:.4s;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.grid img:hover{
  transform:scale(1.08);
}

/* CTA */
.cta{
  padding:80px 20px;
  text-align:center;
}

.cta h2{
  font-family:'Playfair Display';
  color:#6a0dad;
  font-size:36px;
}

.cta p{
  color:#555;
  margin:15px 0;
}

/* FOOTER */
footer{
  text-align:center;
  padding:30px;
  background:#6a0dad;
  color:white;
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<header>
<div class="logo">Julie’s Tranças ✨</div>
</header>

<section class="hero">
  <h1 id="braidText"></h1>
  <p class="frase">Realce sua beleza com tranças únicas ✨</p>
  <div class="typing" id="typing"></div>

  <a class="btn" href="https://wa.me/5511910497848?text=Olá,%20quero%20agendar%20uma%20trança" target="_blank">
    Agendar Agora
  </a>

  <img src="imagens/julie.png">
</section>

<!-- AVATAR -->
<img src="imagens/avatar.png" class="avatar wave">

<!-- TITULO -->
<section class="titulo-fotos">
  <h2>Tranças Realizadas</h2>
  <p>Confira meus trabalhos ✨</p>
</section>

<!-- GALERIA -->
<section class="gallery">
<div class="grid">
  <img src="imagens/foto1.jpg">
  <img src="imagens/foto2.jpg">
  <img src="imagens/foto3.jpg">
  <img src="imagens/foto4.jpg">
  <img src="imagens/foto5.jpg">
  <img src="imagens/foto6.jpg">
  <img src="imagens/foto7.jpg">
</div>
</section>

<!-- CTA -->
<section class="cta">
  <h2>Me chame no WhatsApp e consulte os valores!</h2>
  <p>Atendimento rápido, personalizado e com horários disponíveis 💜</p>

  <a class="btn" href="https://wa.me/5511910497848?text=Olá,%20quero%20consultar%20valores" target="_blank">
    Consultar Agora
  </a>
</section>

<footer>
<p>Contato: 11 91049-7848</p>
</footer>

<script>
// efeito JULIE
const text="JULIE";
const el=document.getElementById("braidText");
let i=0;

function braidEffect(){
 if(i<text.length){
  let span=document.createElement("span");
  span.innerText=text[i];
  span.style.opacity="0";
  span.style.margin="0 5px";
  span.style.transition="0.3s";

  el.appendChild(span);

  setTimeout(()=>{
    span.style.opacity="1";
  },100);

  i++;
  setTimeout(braidEffect,150);
 }
}
braidEffect();

// frases
const phrases=[
"Venha fazer sua trança ✨",
"Renove sua autoestima 💜",
"Fique ainda mais linda 🌸"
];

let pi=0,pj=0,cur=[],del=false;

function loop(){
document.getElementById("typing").innerHTML=cur.join('');

if(!del && pj<phrases[pi].length){
  cur.push(phrases[pi][pj++]);
}
else if(del && pj>0){
  cur.pop(); pj--;
}
else if(pj===phrases[pi].length){
  del=true;
}
else{
  del=false;
  pi=(pi+1)%phrases.length;
}

setTimeout(loop,80);
}
loop();

// partículas
const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
for(let i=0;i<80;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*2
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='rgba(106,13,173,0.3)';
    ctx.fill();

    p.y+=0.4;
    if(p.y>canvas.height)p.y=0;
  });

  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
